<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PampaTec na China</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }

  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #stage img, #stage video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  #logo {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 200px;
    height: auto;
    z-index: 10;
    pointer-events: none;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  }

  #contador {
    position: fixed;
    bottom: 10px;
    right: 14px;
    color: rgba(255,255,255,0.7);
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    z-index: 10;
    pointer-events: none;
  }

  .nav-zona {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 20%;
    z-index: 5;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .nav-zona:hover { opacity: 0.35; }
  #zonaAnterior {
    left: 0;
    background: linear-gradient(to right, rgba(255,255,255,0.6), rgba(255,255,255,0));
  }
  #zonaProxima {
    right: 0;
    background: linear-gradient(to left, rgba(255,255,255,0.6), rgba(255,255,255,0));
  }
</style>
</head>
<body>

<img id="logo" src="Logo PampaTec.png" alt="PampaTec">

<div id="stage"></div>
<div id="contador"></div>

<div id="zonaAnterior" class="nav-zona" title="Anterior"></div>
<div id="zonaProxima" class="nav-zona" title="Próximo"></div>

<script>
  var ARQUIVOS = [
    "media/1.jpg",
    "media/2.jpg",
    "media/3.jpg",
    "media/4.jpg",
    "media/5.mp4",
    "media/6.mp4",
    "media/7.mp4",
    "media/8.mp4",
    "media/9.jpg",
    "media/10.jpg",
    "media/11.jpg",
    "media/12.mp4",
    "media/13.jpg",
    "media/14.mp4",
    "media/15.mp4",
    "media/16.jpg",
    "media/17.jpg",
    "media/18.mp4",
    "media/19.mp4",
    "media/20.jpg",
    "media/21.mp4",
    "media/22.jpg",
    "media/23.jpg",
    "media/24.mp4",
    "media/25.mp4",
    "media/26.jpg",
    "media/27.mp4",
    "media/28.mp4",
    "media/29.mp4",
    "media/30.mp4",
    "media/31.mp4",
    "media/32.mp4",
    "media/33.mp4",
    "media/34.mp4",
    "media/35.mp4",
    "media/36.jpg",
    "media/37.mp4",
    "media/38.jpg",
    "media/39.jpg",
    "media/40.jpg",
    "media/41.jpg",
    "media/42.jpg",
    "media/43.jpg",
    "media/44.mp4",
    "media/45.mp4",
    "media/46.jpg",
    "media/47.jpg",
    "media/48.jpg",
    "media/49.jpg",
    "media/50.jpg",
    "media/51.jpg",
    "media/52.jpg",
    "media/53.mp4",
    "media/54.mp4",
    "media/55.mp4",
    "media/56.mp4"
  ];

  var stage = document.getElementById('stage');
  var contador = document.getElementById('contador');
  var index = 0;
  var atual = null;

  function mostrar(i) {
    if (i < 0) i = ARQUIVOS.length - 1;
    if (i >= ARQUIVOS.length) i = 0;
    index = i;
    stage.innerHTML = '';
    var src = ARQUIVOS[index];
    var el;
    var ehVideo = /\.(mp4|mov|webm)$/i.test(src);
    if (ehVideo) {
      el = document.createElement('video');
      el.src = src;
      el.controls = true;
      el.autoplay = true;
      el.playsInline = true;
      el.muted = false;
      el.addEventListener('loadedmetadata', function () { el.play().catch(function(){}); });
    } else {
      el = document.createElement('img');
      el.src = src;
      el.alt = src;
    }
    stage.appendChild(el);
    atual = el;
    contador.textContent = (index + 1) + ' / ' + ARQUIVOS.length;
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { mostrar(index + 1); }
    else if (e.key === 'ArrowLeft') { mostrar(index - 1); }
  });

  document.getElementById('zonaAnterior').addEventListener('click', function () { mostrar(index - 1); });
  document.getElementById('zonaProxima').addEventListener('click', function () { mostrar(index + 1); });

  mostrar(0);
</script>
</body>
</html>
